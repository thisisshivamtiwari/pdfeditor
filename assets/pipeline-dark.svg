<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img">
<title>How Still opens, edits and exports a PDF</title>
<rect x="0.5" y="0.5" width="1199" height="259" rx="18" fill="#111522" stroke="#2a3147"/>
<path d="M26 92H1174" stroke="#2a3147" stroke-width="2"/>
<circle cy="92" r="5" fill="#818cf8"><animate attributeName="cx" values="26;1174" dur="6s" repeatCount="indefinite"/></circle>
<rect x="26" y="40" width="168" height="104" rx="12" fill="#1a2033" stroke="#2a3147"/><circle cx="50" cy="64" r="12" fill="#23284a"/><text x="50" y="68.5" font-size="12" font-weight="700" text-anchor="middle" fill="#818cf8">1</text><text x="72" y="69.5" font-size="16" font-weight="700" fill="#e6e9f2">Open</text><text x="40" y="102" font-size="12" fill="#9aa3b8">Bytes are read into</text><text x="40" y="120" font-size="12" fill="#9aa3b8">memory once</text>
<path d="M212 87l5 5-5 5" fill="none" stroke="#9aa3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="222" y="40" width="168" height="104" rx="12" fill="#1a2033" stroke="#2a3147"/><circle cx="246" cy="64" r="12" fill="#23284a"/><text x="246" y="68.5" font-size="12" font-weight="700" text-anchor="middle" fill="#818cf8">2</text><text x="268" y="69.5" font-size="16" font-weight="700" fill="#e6e9f2">Validate</text><text x="236" y="102" font-size="12" fill="#9aa3b8">Intact, unencrypted,</text><text x="236" y="120" font-size="12" fill="#9aa3b8">unsigned</text>
<path d="M408 87l5 5-5 5" fill="none" stroke="#9aa3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="418" y="40" width="168" height="104" rx="12" fill="#1a2033" stroke="#2a3147"/><circle cx="442" cy="64" r="12" fill="#23284a"/><text x="442" y="68.5" font-size="12" font-weight="700" text-anchor="middle" fill="#818cf8">3</text><text x="464" y="69.5" font-size="16" font-weight="700" fill="#e6e9f2">Snapshot</text><text x="432" y="102" font-size="12" fill="#9aa3b8">Info dict, XMP streams,</text><text x="432" y="120" font-size="12" fill="#9aa3b8">document ID</text>
<path d="M604 87l5 5-5 5" fill="none" stroke="#9aa3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="614" y="40" width="168" height="104" rx="12" fill="#1a2033" stroke="#2a3147"/><circle cx="638" cy="64" r="12" fill="#23284a"/><text x="638" y="68.5" font-size="12" font-weight="700" text-anchor="middle" fill="#818cf8">4</text><text x="660" y="69.5" font-size="16" font-weight="700" fill="#e6e9f2">Edit</text><text x="628" y="102" font-size="12" fill="#9aa3b8">Replayable edit list</text><text x="628" y="120" font-size="12" fill="#9aa3b8">with undo / redo</text>
<path d="M800 87l5 5-5 5" fill="none" stroke="#9aa3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="810" y="40" width="168" height="104" rx="12" fill="#1a2033" stroke="#2a3147"/><circle cx="834" cy="64" r="12" fill="#23284a"/><text x="834" y="68.5" font-size="12" font-weight="700" text-anchor="middle" fill="#818cf8">5</text><text x="856" y="69.5" font-size="16" font-weight="700" fill="#e6e9f2">Export</text><text x="824" y="102" font-size="12" fill="#9aa3b8">Incremental save on</text><text x="824" y="120" font-size="12" fill="#9aa3b8">a temporary copy</text>
<path d="M996 87l5 5-5 5" fill="none" stroke="#9aa3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1006" y="40" width="168" height="104" rx="12" fill="#1a2033" stroke="#2a3147"/><circle cx="1030" cy="64" r="12" fill="#23284a"/><text x="1030" y="68.5" font-size="12" font-weight="700" text-anchor="middle" fill="#818cf8">6</text><text x="1052" y="69.5" font-size="16" font-weight="700" fill="#e6e9f2">Verify</text><text x="1020" y="102" font-size="12" fill="#9aa3b8">Snapshot must match</text><text x="1020" y="120" font-size="12" fill="#9aa3b8">exactly</text>
<path d="M1090 144v20M772 164H1090M772 164v22M1046 164v22" fill="none" stroke="#9aa3b8" stroke-width="1.4" stroke-dasharray="4 4"/>
<rect x="640" y="186" width="264" height="36" rx="18" fill="#12301f"/><text x="772" y="209" font-size="13" font-weight="600" text-anchor="middle" fill="#4ade80">Match → file moved into place</text>
<rect x="918" y="186" width="256" height="36" rx="18" fill="#3a1618"/><text x="1046" y="209" font-size="13" font-weight="600" text-anchor="middle" fill="#f87171">Mismatch → nothing is saved</text>
<text x="26" y="202" font-size="13" font-weight="600" fill="#e6e9f2">The original file is never modified.</text><text x="26" y="222" font-size="13" fill="#9aa3b8">Exports always go to a new file, written atomically.</text>
</svg>
